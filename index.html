<!DOCTYPE html>
<html>
<head>
<title>Pertanyaan Penting</title>

<style>
body{
    text-align:center;
    font-family:'Comic Sans MS', cursive;
    margin-top:100px;
    background: #fff0f5;
}

h1{
    color:#ff69b4;
}

button{
    border:none;
    padding:15px 30px;
    margin:10px;
    border-radius:999px;
    font-size:18px;
    cursor:pointer;
    transition:0.3s;
    box-shadow:0 4px 10px rgba(0,0,0,0.15);
}

button:hover{
    transform:scale(1.1);
}

button:first-of-type{
    background:#ff69b4;
    color:white;
}

#no{
    position:absolute;
    background:#ffffff;
    color:#ff69b4;
    border:2px solid #ff69b4;
}
</style>
</head>

<body>

<h1>Mau traktir aku es krim gaa? 🍦</h1>

<button onclick="alert('mwehehehe☺️')">
    🍦 Traktir Dong
</button>

<button id="no">
    😤 Gamau
</button>

<script>
const emoji = ["💖","🌷","✨","🐸","🍦"];
const noBtn = document.getElementById("no");

function kabur() {
    const x = Math.random() * (window.innerWidth - 120);
    const y = Math.random() * (window.innerHeight - 80);

    noBtn.style.left = x + "px";
    noBtn.style.top = y + "px";

    const item = document.createElement("div");

    item.innerHTML =
    emoji[Math.floor(Math.random() * emoji.length)];

    item.style.position = "absolute";
    item.style.left = x + "px";
    item.style.top = y + "px";
    item.style.fontSize = "30px";

    document.body.appendChild(item);
}

noBtn.addEventListener("mouseover", kabur);
noBtn.addEventListener("touchstart", kabur);
</script>
</body>
</html>
