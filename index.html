<!DOCTYPE html>
<html>
<head>
<title>Pertanyaan Penting</title>

<style>
body{
    text-align:center;
    font-family:'Comic Sans MS', cursive;
    margin-top:100px;
    min-height:100vh;
    
    background: linear-gradient(
    135deg,
    #fff0f5,
    #ffe4f2,
    #fdf2ff
 );
}

h1{
    color:#ff69b4;
} 
    .sub{
    color:#d87bb1;
    font-size:14px;
    margin-bottom:20px;
    }

button{
    border:1px solid rgba(255,255,255,0.4);
    padding:15px 30px;
    margin:10px;
    border-radius:999px;
    font-size:18px;
    cursor:pointer;

    background:rgba(255,255,255,0.25);
    backdrop-filter:blur(12px);
    -webkit-backdrop-filter:blur(12px);

    box-shadow:
        0 8px 20px rgba(0,0,0,0.1),
        inset 0 1px 1px rgba(255,255,255,0.6);

    transition:all 0.3s ease;
}
button:hover{
    transform:scale(1.08);
    box-shadow:
        0 12px 25px rgba(0,0,0,0.15),
        inset 0 1px 1px rgba(255,255,255,0.8);
}

button:first-of-type{
    background:rgba(255,105,180,0.25);
    color:#ff1493;
}

#no{
    position:absolute;

    background:rgba(255,255,255,0.35);
    color:#ff1493;

    border:1px solid rgba(255,255,255,0.5);
}
    
    .pop{
    animation: pop 0.3s ease;
}

@keyframes pop{
    from{
        transform: scale(0);
    }

    to{
        transform: scale(1);
    }
}
    .footer{
    position:fixed;
    bottom:10px;
    width:100%;

    color:#d87bb1;
    font-size:12px;
    opacity:0.8;
}
    
</style>
</head>

<body>

<h1>Mau traktir aku es krim gaa? 🍦</h1>
    <p class="sub">
    Jangan buru-buru pilih 😗
    </p>

<button onclick="alert('mwehehehe☺️')">
    🍦 Traktir Dong
</button>

<button id="no">
    😤 Gamau
</button>

<script>
const emoji = ["💖","🌷","✨","🖤","🍦","❤️","😗"];
const noBtn = document.getElementById("no");
let count = 0;
const judul = document.querySelector("h1");
    
function kabur() {
    count++;
    const x = Math.random() * (window.innerWidth - 120);
    const y = Math.random() * (window.innerHeight - 80);

    noBtn.style.left = x + "px";
    noBtn.style.top = y + "px";

    const item = document.createElement("div");
    item.classList.add("pop");
    
    item.innerHTML =
    emoji[Math.floor(Math.random() * emoji.length)];

    item.style.position = "absolute";
    item.style.left = x + "px";
    item.style.top = y + "px";
    item.style.fontSize = "30px";
    item.style.pointerEvents = "none";

    document.body.appendChild(item);

    if(count >= 1){
       judul.innerHTML = "Yakin ga mau? 🥺";
    }

   if(count >= 3){
      judul.innerHTML = "Aku baik loh 😔";
   }

   if(count >= 5){
      judul.innerHTML = "Masa sih gamau?";
   }

    if(count >= 8){
      judul.innerHTML = "Aku mulai curiga 😑";
}

if(count >= 10){
      judul.innerHTML = "Kok niat banget ngejarnya 😭";
}

if(count >= 14){
      judul.innerHTML = "Yaudah aku ngalah 😔";
}

if(count >= 18){
      judul.innerHTML = "BOONG 😗";
}
    
}

noBtn.addEventListener("mouseover", kabur);
noBtn.addEventListener("touchstart", kabur);
</script>
    <p class="footer">
    made with Bii
    </p>
</body>
</html>
